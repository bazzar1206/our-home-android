/* Responsive layout: prioritise readable record titles on narrow screens. */
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-width:0;overflow-x:hidden}
.app{width:100%;max-width:1000px;margin-inline:auto;padding:clamp(12px,3vw,28px) clamp(12px,3vw,28px) calc(105px + env(safe-area-inset-bottom))}
#content,.panel,.item{min-width:0;max-width:100%}
.record-head{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'title menu' 'pills pills';align-items:center;column-gap:10px;row-gap:8px}
.record-toggle{grid-area:title;width:100%;min-width:0;font-size:clamp(16px,2.2vw,19px);line-height:1.35;overflow-wrap:break-word}
.record-title-content{min-width:0;overflow-wrap:break-word}
.record-menu{grid-area:menu;justify-self:end;align-self:center}
.menu-trigger{min-width:44px;min-height:44px;display:grid;place-items:center}
.attachment-pills{grid-area:pills;justify-self:stretch;justify-content:flex-start;max-width:none;min-width:0;gap:6px;padding-left:33px}
.attachment-pill{max-width:100%;font-size:clamp(11px,1.8vw,13px);min-height:32px;overflow-wrap:anywhere;white-space:normal;text-align:left}
.policy-days{white-space:normal;line-height:1.5}
.travel-info{line-height:1.5}
.nav{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
.nav button{min-width:0;min-height:55px}
input,select,textarea{min-width:0;max-width:100%}

function googleIdentityReady(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2)return resolve();const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.onload=()=>window.google?.accounts?.oauth2?resolve():reject(Error('Google Sign-In unavailable'));script.onerror=()=>reject(Error('Cannot load Google Sign-In. Check network or browser blockers.'));document.head.appendChild(script)})}
function getDriveToken(clientId){return new Promise((resolve,reject)=>{let finished=false;const client=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive.file',callback:response=>{if(finished)return;finished=true;if(response.error||!response.access_token)reject(Error(response.error_description||response.error||'Google did not grant access'));else resolve(response.access_token)},error_callback:err=>{if(finished)return;finished=true;reject(Error(err.message||err.type||'Google sign-in failed'))}});client.requestAccessToken({prompt:'consent'})})}
async function uploadToDrive(file,token){
const begin=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':'application/json','X-Upload-Content-Length':String(file.size)},body:JSON.stringify({name:file.name,mimeType:'application/json'})});
if(!begin.ok)throw Error('Google Drive upload setup failed ('+begin.status+'): '+(await begin.text()).slice(0,200));
const location=begin.headers.get('Location');if(!location)throw Error('Google Drive did not return an upload URL');
const response=await fetch(location,{method:'PUT',headers:{'Content-Type':'application/json'},body:file});
if(!response.ok)throw Error('Google Drive upload failed ('+response.status+'): '+(await response.text()).slice(0,200));
return response.json();
}

function policyDays(date){
if(!date)return null;
const parts=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
if(!parts)return null;
const y=Number(parts[1]),m=Number(parts[2]),d=Number(parts[3]);
const target=Date.UTC(y,m-1,d),check=new Date(target);
if(check.getUTCFullYear()!==y||check.getUTCMonth()!==m-1||check.getUTCDate()!==d)return null;
const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
return Math.round((target-today)/86400000);
}

function shortDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return '';const [y,m,d]=date.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):''}
function policyStatus(date){
const days=policyDays(date);
if(days===null)return 'No expiry date';
if(days<0)return 'Expired';
if(days===0)return 'Expires today · '+shortDate(date);
return days+' '+(days===1?'day':'days')+' remaining · Expires '+shortDate(date);
}

function inventorySafeName(value){return String(value||'item').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,65)||'item'}
function inventoryDownload(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function inventoryZip(entries){
 const enc=new TextEncoder(),parts=[],central=[];let offset=0;
 const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
 const table=new Uint32Array(256);for(let n=0;n<256;n++){let v=n;for(let j=0;j<8;j++)v=(v&1)?(0xedb88320^(v>>>1)):(v>>>1);table[n]=v>>>0}
 for(const e of entries){
  const name=enc.encode(e.name),bytes=e.bytes;let crc=0xffffffff;for(const b of bytes)crc=table[(crc^b)&255]^(crc>>>8);crc=(crc^0xffffffff)>>>0;
  const local=new Uint8Array([80,75,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(name.length),...u16(0)]);
  parts.push(local,name,bytes);
  central.push(new Uint8Array([80,75,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),name);
  offset+=local.length+name.length+bytes.length;
 }
 const centralSize=central.reduce((n,p)=>n+p.length,0);
 const end=new Uint8Array([80,75,5,6,...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(centralSize),...u32(offset),...u16(0)]);
 return new Blob([...parts,...central,end],{type:'application/zip'})
}

async function exportInventoryReport(selectedIds=null){
 const records=(await all()).filter(r=>r.section==='Inventory'&&!r.archived&&(inventoryFilter==='All'||(r.category||'Other')===inventoryFilter)&&(inventoryRoomFilter==='All'||r.room===inventoryRoomFilter)&&(!selectedIds||selectedIds.includes(r.id)));
 if(!selectedIds){showInventoryReportPicker(records);return}
 if(!records.length){alert('No current inventory items match your filters.');return}
 if(!confirm('Create an insurance inventory ZIP with a printable report and individually named item photos for '+records.length+' item(s)? The report may contain private serial numbers and purchase values.'))return;
 const button=document.getElementById('inventoryReport');if(button){button.disabled=true;button.textContent='Preparing…'}
 try{
  const enc=new TextEncoder(),entries=[],rows=[],imageNames=new Set();let total=0;
  for(const [index,r] of records.entries()){
   const photos=[];
   for(let j=0;j<(r.photos||[]).length;j++){
    const data=r.photos[j];if(typeof data!=='string'||!data.startsWith('data:image/'))continue;
    const mime=data.slice(5,data.indexOf(';')).toLowerCase(),ext=mime.includes('png')?'png':mime.includes('webp')?'webp':'jpg';
    let name=inventorySafeName(r.title)+'-'+String(index+1).padStart(3,'0')+'-photo-'+String(j+1).padStart(2,'0')+'.'+ext;
    while(imageNames.has(name))name=inventorySafeName(r.title)+'-'+String(index+1)+'-'+crypto.randomUUID().slice(0,6)+'.'+ext;
    imageNames.add(name);
    const response=await fetch(data),bytes=new Uint8Array(await response.arrayBuffer());entries.push({name:'images/'+name,bytes});photos.push({name,data})
   }
   const documents=[];
   for(const attachment of (r.attachments||[])){
    const data=attachment.data;if(typeof data!=='string'||!data.startsWith('data:'))continue;
    const mime=data.slice(5,data.indexOf(';')).toLowerCase();
    const isImage=mime.startsWith('image/');
    const originalExtension=String(attachment.name||'').match(/\.([a-z0-9]{1,8})$/i)?.[1]?.toLowerCase();
    const ext=isImage?(mime.includes('png')?'png':mime.includes('webp')?'webp':mime.includes('gif')?'gif':mime.includes('heic')?'heic':'jpg'):(originalExtension||({'application/pdf':'pdf','application/msword':'doc','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx','text/plain':'txt'}[mime]||'bin'));
    const label=inventorySafeName(attachment.nickname||attachment.name||'document');
    let name=inventorySafeName(r.title)+'-'+String(index+1).padStart(3,'0')+'-'+label+'.'+ext;
    let suffix=2;while(imageNames.has(name))name=inventorySafeName(r.title)+'-'+String(index+1).padStart(3,'0')+'-'+label+'-'+suffix+++'.'+ext;
    imageNames.add(name);
    const response=await fetch(data),bytes=new Uint8Array(await response.arrayBuffer());
    entries.push({name:'images/'+name,bytes});
    if(isImage)photos.push({name,data});else documents.push({name,type:attachment.type||'Document'})
   }
   const price=Number(r.price);if(r.price!==''&&r.price!=null&&Number.isFinite(price))total+=price;
   rows.push({r,photos,documents})
  }
  const h=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const report='<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Our Home — Insurance Inventory</title><style>body{font:15px Arial,sans-serif;max-width:960px;margin:30px auto;padding:0 20px;color:#222}h1{margin-bottom:4px}.muted{color:#666}.item{break-inside:avoid;border-top:1px solid #bbb;padding:18px 0}dl{display:grid;grid-template-columns:160px 1fr;gap:5px 12px}dt{font-weight:bold}dd{margin:0;overflow-wrap:anywhere}.photos{display:flex;flex-wrap:wrap;gap:12px}.photos img{max-width:260px;max-height:200px;object-fit:contain;border:1px solid #ccc}figcaption{font-size:12px;overflow-wrap:anywhere}figure{margin:0}@media print{body{margin:0}.item{break-inside:avoid}}</style></head><body><h1>Household Inventory — Insurance Report</h1><p class="muted">Generated '+h(new Date().toLocaleString('en-GB'))+' · '+rows.length+' items · Recorded purchase costs £'+total.toFixed(2)+'</p><p class="muted">Based on information entered into Our Home. Values are original recorded purchase prices, not replacement valuations. Verify details and coverage with your insurer.</p>'+rows.map(({r,photos,documents})=>'<section class="item"><h2>'+h(r.title)+'</h2><dl>'+[['Category',r.category],['Location',r.room],['Brand',r.brand],['Model',r.model],['Serial number',r.serial],['Purchase date',r.purchaseDate],['Retailer',r.retailer],['Purchase price',r.price!==''&&r.price!=null?'£'+Number(r.price).toFixed(2):''],['Warranty expiry',r.warrantyEnd],['Condition',r.condition],['Notes',r.details]].filter(x=>x[1]!==''&&x[1]!=null).map(([k,v])=>'<dt>'+h(k)+'</dt><dd>'+h(v)+'</dd>').join('')+'</dl>'+(photos.length?'<div class="photos">'+photos.map(photo=>'<figure><img src="'+h(photo.data)+'" alt="'+h(r.title)+'"><figcaption>'+h(photo.name)+'</figcaption></figure>').join('')+'</div>' :'<p class="muted">No uploaded item photographs attached.</p>')+(documents.length?'<h3>Supporting documents</h3><ul>'+documents.map(doc=>'<li>'+h(doc.type)+': '+h(doc.name)+' (included in the ZIP images folder)</li>').join('')+'</ul>':'')+'</section>').join('')+'</body></html>';
  entries.unshift({name:'Inventory-Insurance-Report.html',bytes:enc.encode(report)});
  inventoryDownload(inventoryZip(entries),'Our-Home-Insurance-Inventory-'+new Date().toISOString().slice(0,10)+'.zip');
 }catch(err){alert('Unable to prepare inventory report: '+err.message)}
 finally{if(button){button.disabled=false;button.textContent='⬇ Report'}}
}

function enableShareSelection(root=document){
 const cards=[...root.querySelectorAll('article.item[data-share-record],#records article.item')];
 if(!cards.length){alert('There are no records to select.');return}
 const old=document.getElementById('shareSelectionBar');if(old){old.remove();cards.forEach(c=>c.querySelector('.share-checkbox')?.remove());return}

 const buildText=async()=>{

  if(!ids.length){alert('Select at least one card.');return null}

  for(const r of selected){lines.push('────────────────────────');lines.push((r.section||'Record')+' — '+(r.provider||r.title||r.name||'Untitled'));
   for(const [key,value] of Object.entries(r)){

   }
   for(const field of (Array.isArray(r.customFields)?r.customFields:[]))if(field.label)lines.push(field.label+': '+(field.value||''));lines.push('')
  }
  return lines.join('\n')
 };
 document.getElementById('shareCopy').onclick=async()=>{const t=await buildText();if(!t)return;try{await navigator.clipboard.writeText(t);alert('Selected records copied to clipboard. Be careful where you paste them.')}catch(e){alert('Clipboard unavailable on this browser. Use Download TXT instead.')}};
 document.getElementById('shareDownload').onclick=async()=>{const t=await buildText();if(!t)return;const url=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='our-home-selected.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
 document.getElementById('shareTxt').onclick=async()=>{const t=await buildText();if(!t)return;const file=new File([t],'our-home-selected.txt',{type:'text/plain'});
  if(navigator.share){try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Our Home selected records'});return}await navigator.share({title:'Our Home selected records',text:t});return}catch(e){if(e.name==='AbortError')return}}
  alert('Your browser does not support the system share sheet here. Use Copy to clipboard or Download TXT.')
 };
}

ntDefault();const data=Object.fromEntries(new FormData(e.target));if(!String(data.provider||'').trim()){alert('Please enter the holding company / provider.');document.getElementById('fin_provider').focus();return}data.title=data.provider;data.archived=data.closed==='yes';data.closed=data.archived;data.customFields=[...host.querySelectorAll('.fin-custom')].map(el=>({label:el.querySelectorAll('input')[0].value.trim(),value:el.querySelectorAll('input')[1].value.trim()})).filter(f=>f.label);try{await put({...rec,...data,id:rec?.id||crypto.randomUUID(),section:'Finances',updated:new Date().toISOString()});await render();window.scrollTo({top:0,behavior:'smooth'})}catch(err){alert('Could not save account: '+err.message)}}}

async function showEditor(rec=null){editing=rec;const financeAccounts=(await all()).filter(x=>x.section==='Finances'&&!x.archived);const host=document.getElementById('editor');host.innerHTML='<form class="panel" id="recordForm"><h2>'+(rec?'Edit':'Add')+' '+esc(page)+'</h2>'+fields[page].map(([key,label,type])=>'<label for="f_'+key+'">'+esc(label)+'</label>'+(type==='coverType'?'<select id="f_'+key+'" name="'+key+'">'+['Individual','Group','Family'].map(v=>'<option value="'+v+'" '+((rec?.[key]||'Individual')===v?'selected':'')+'>'+v+'</option>').join('')+'</select>':type==='contractFrequency'?'<select id="f_'+key+'" name="'+key+'"><option value="">Choose frequency</option>'+['Weekly','Fortnightly','Every 4 weeks','Monthly','Quarterly','Every 6 months','Annually','One-off'].map(v=>'<option value="'+esc(v)+'" '+(rec?.[key]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':type==='financeAccount'?'<select id="f_'+key+'" name="'+key+'"><option value="">Not linked to an account</option>'+financeAccounts.map(a=>'<option value="'+esc(a.id)+'" '+(rec?.[key]===a.id?'selected':'')+'>'+esc(a.provider||a.title||'Bank')+' · '+esc(a.holder||'')+' · '+esc(a.accountType||'Account')+(a.accountNumber?' · …'+esc(String(a.accountNumber).slice(-4)):'')+'</option>').join('')+'</select>':type==='inventoryCategory'?'<select id="f_'+key+'" name="'+key+'">'+inventoryCategories.map(v=>'<option value="'+esc(v)+'" '+((rec?.[key]||'Electronics')===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':type==='inventoryCondition'?'<select id="f_'+key+'" name="'+key+'">'+['New','Excellent','Good','Fair','Needs repair'].map(v=>'<option value="'+esc(v)+'" '+((rec?.[key]||'Good')===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':type==='contractCategory'?'<select id="f_'+key+'" name="'+key+'">'+['Mobile phones','Broadband','Utilities','TV & subscriptions','Vehicle finance','Employment'].map(v=>'<option value="'+esc(v)+'" '+((rec?.[key]||'Mobile phones')===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':type==='category'?'<select id="f_'+key+'" name="'+key+'">'+['Home','Vehicle','Life','Travel','Pet','Other'].map(v=>'<option value="'+v+'" '+(((rec?.[key]==='Car'?'Vehicle':rec?.[key])||'Home')===v?'selected':'')+'>'+categoryDisplay(v)+' '+v+'</option>').join('')+'</select>':type==='textarea'?'<textarea id="f_'+key+'" name="'+key+'">'+esc(rec?.[key]||'')+'</textarea>':'<input id="f_'+key+'" name="'+key+'" type="'+type+'" '+(key==='title'?'required':'')+' value="'+esc(rec?.[key]||'')+'">')).join('') +((page==='Insurance'||page==='Contracts'||page==='Inventory')?'<div class="doc-heading"><strong>Documents &amp; attachments</strong></div><label for="insuranceFiles">Upload documents (PDF, Word, images)</label><input id="insuranceFiles" type="file" accept=".pdf,.doc,.docx,image/*" multiple><div class="camera-upload"><label for="cameraFile">📷 Take a photo<input id="cameraFile" type="file" accept="image/*" capture="environment"></label></div><p class="muted">Maximum 5 MB per file. Stored locally in this browser.</p><div id="existingAttachments">'+(rec?.attachments||[]).map((a,i)=>'<div class="attachment" data-existing="'+i+'"><label>File type</label><select data-doc-type="'+i+'">'+docTypeOptions(docType(a))+'</select><label class="custom-type" '+(docType(a)==='Other'?'':'hidden')+'>Other attachment type<input data-custom-type="'+i+'" value="'+esc(a.customType||'')+'" placeholder="e.g. Breakdown cover"></label><label>Document nickname</label><input data-nickname="'+i+'" value="'+esc(a.nickname||a.name)+'"><small>Uploaded '+esc(formatDate(a.uploadedAt))+' · '+esc(a.name)+'</small><a href="'+a.data+'" download="'+esc(a.name)+'">Download</a> <button class="btn secondary" type="button" data-remove-attachment="'+i+'">Remove</button></div>').join('')+'</div><div id="newAttachments"></div>':'')+'<div class="actions"><button class="btn" type="submit">Save</button><button class="btn secondary" type="button" id="cancel">Cancel</button></div></form>';host.scrollIntoView({behavior:'smooth',block:'start'});const form=document.getElementById('recordForm');
const initialForm=new FormData(form);
const originalValues=[...initialForm.entries()].map(([k,v])=>[k,String(v)]);
let formTouched=false;
form.addEventListener('input',()=>formTouched=true);
form.addEventListener('change',()=>formTouched=true);
document.getElementById('cancel').onclick=()=>{
const currentValues=[...new FormData(form).entries()].map(([k,v])=>[k,String(v)]);
const modified=formTouched||JSON.stringify(currentValues)!==JSON.stringify(originalValues);
if(modified&&!confirm('Discard your unsaved changes?'))return;
host.innerHTML='';
};
if(page==='Insurance'){
const category=document.getElementById('f_category');
const registration=document.getElementById('f_registration');const petName=document.getElementById('f_petName');const petNameLabel=document.querySelector('label[for="f_petName"]');
const rowLabel=document.querySelector('label[for="f_registration"]');
const travelDestination=document.getElementById('f_travelDestination');const travelDate=document.getElementById('f_travelDate');const travelDestinationLabel=document.querySelector('label[for="f_travelDestination"]');const travelDateLabel=document.querySelector('label[for="f_travelDate"]');travelDateLabel.textContent='Start date / date of travel';
const coverType=document.getElementById('f_coverType');const coveredName=document.getElementById('f_coveredName');const coverTypeLabel=document.querySelector('label[for="f_coverType"]');const coveredNameLabel=document.querySelector('label[for="f_coveredName"]');
const renewalLabel=document.querySelector('label[for="f_renewal"]');
const toggleRegistration=()=>{const pet=category.value==='Pet';petName.hidden=!pet;petNameLabel.hidden=!pet;petName.disabled=!pet;renewalLabel.textContent=category.value==='Travel'?'End date':'Renewal date';const show=category.value==='Vehicle';registration.hidden=!show;rowLabel.hidden=!show;registration.disabled=!show;const travel=category.value==='Travel';for(const el of [travelDestination,travelDate,travelDestinationLabel,travelDateLabel])el.hidden=!travel;travelDestination.disabled=!travel;travelDate.disabled=!travel;const eligible=travel||category.value==='Life';coverType.hidden=!eligible;coverTypeLabel.hidden=!eligible;coverType.disabled=!eligible;const individual=eligible&&coverType.value==='Individual';coveredName.hidden=!individual;coveredNameLabel.hidden=!individual;coveredName.disabled=!individual};
category.addEventListener('change',toggleRegistration);coverType.addEventListener('change',toggleRegistration);
toggleRegistration();
}
let pendingInsuranceFiles=[];
if(page==='Insurance'||page==='Contracts'||page==='Inventory'){host.addEventListener('change',e=>{if(e.target.matches('[data-doc-type],[data-new-type]')){const label=e.target.nextElementSibling;if(label?.classList.contains('custom-type'))label.hidden=e.target.value!=='Other'}});document.querySelectorAll('[data-remove-attachment]').forEach(b=>b.onclick=()=>b.closest('.attachment').remove());const refreshPendingFiles=()=>{document.getElementById('newAttachments').innerHTML=pendingInsuranceFiles.map((f,i)=>'<div class="attachment"><label>File type for '+esc(f.name)+'</label><select data-new-type="'+i+'">'+docTypeOptions(docType({name:f.name}))+'</select><label class="custom-type" '+(docType({name:f.name})==='Other'?'':'hidden')+'>Other attachment type<input data-new-custom-type="'+i+'" placeholder="e.g. Breakdown cover"></label><label>Nickname for '+esc(f.name)+'</label><input data-new-nickname="'+i+'" value="'+esc(f.name.replace(/\.[^.]+$/,''))+'"><small>Upload date: '+esc(new Date().toLocaleDateString('en-GB'))+' · '+esc(f.name)+'</small></div>').join('')};
document.getElementById('insuranceFiles').onchange=e=>{pendingInsuranceFiles.push(...e.target.files);refreshPendingFiles();e.target.value=''};
document.getElementById('cameraFile').onchange=e=>{pendingInsuranceFiles.push(...e.target.files);refreshPendingFiles();e.target.value=''};
}document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());const photos=[...(rec?.photos||[])];let attachments=[...(rec?.attachments||[])];if(page==='Insurance'||page==='Contracts'||page==='Inventory'){attachments=[...(rec?.attachments||[])].flatMap((a,i)=>{const el=document.querySelector('[data-existing="'+i+'"]');return el?[{...a,nickname:el.querySelector('[data-nickname]').value.trim()||a.name,type:el.querySelector('[data-doc-type]').value,customType:el.querySelector('[data-doc-type]').value==='Other'?el.querySelector('[data-custom-type]').value.trim():''}]:[]});const fs=pendingInsuranceFiles;for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>5*1024*1024){alert('File too large (5 MB maximum): '+f.name);return}try{attachments.push({id:crypto.randomUUID(),name:f.name,type:document.querySelector('[data-new-type="'+i+'"]')?.value||'Other',customType:document.querySelector('[data-new-type="'+i+'"]')?.value==='Other'?(document.querySelector('[data-new-custom-type="'+i+'"]')?.value.trim()||''):'',nickname:document.querySelector('[data-new-nickname="'+i+'"]')?.value.trim()||f.name,uploadedAt:new Date().toISOString(),data:await fileData(f)})}catch(err){alert('Could not read document: '+err.message);return}}}if(page==='Insurance'&&data.category!=='Vehicle')data.registration='';if(page==='Insurance'&&data.category!=='Pet')data.petName='';if(page==='Insurance'&&data.coverType!=='Individual')data.coveredName='';const saved={...rec,...data,id:rec?.id||crypto.randomUUID(),section:page,photos,attachments,updated:new Date().toISOString()};try{await put(saved);render()}catch(err){alert('Could not save. Browser storage may be full. '+err.message)}}}
function formatDate(value){if(!value)return 'Unknown date';const d=new Date(value);return isNaN(d.getTime())?'Unknown date':d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function fileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||Error('File read failed'));reader.readAsDataURL(file)})}
function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))}catch(e){reject(e)}finally{URL.revokeObjectURL(u)}};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Unsupported image'))};img.src=u})}
const headerSettingsButton=document.getElementById('settings'),headerSettingsMenu=document.getElementById('headerSettingsMenu');function closeHeaderSettings(){headerSettingsMenu.hidden=true;headerSettingsButton.setAttribute('aria-expanded','false')}headerSettingsButton.onclick=e=>{e.stopPropagation();const cardAction=document.getElementById('headerCardDisplay');cardAction.hidden=page==='Home'||page==='Settings'||page==='Search'||page==='Add'||page==='Calendar';headerSettingsMenu.hidden=!headerSettingsMenu.hidden;headerSettingsButton.setAttribute('aria-expanded',String(!headerSettingsMenu.hidden))};document.getElementById('headerEditDashboard').onclick=()=>{closeHeaderSettings();layoutEditing=true;navigate('Home')};document.getElementById('headerMainSettings').onclick=()=>{closeHeaderSettings();navigate('Settings')};document.getElementById('headerCardDisplay').onclick=()=>{closeHeaderSettings();if(page==='Finances'){if(financeUnlocked)showFinanceCardSettings();else alert('Unlock Finance first')}else if(page==='Insurance')showInsuranceCardSettings();else showGenericCardSettings(page)};document.addEventListener('click',e=>{if(!e.target.closest('.header-settings-wrap'))closeHeaderSettings()});render().catch(e=>{document.getElementById('content').textContent='Unable to open local storage: '+e.message});
</script></body></html>
