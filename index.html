function policyDays(date){
if(!date)return null;
const parts=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
if(!parts)return null;
const y=Number(parts[1]),m=Number(parts[2]),d=Number(parts[3]);
const target=Date.UTC(y,m-1,d),check=new Date(target);
if(check.getUTCFullYear()!==y||check.getUTCMonth()!==m-1||check.getUTCDate()!==d)return null;
const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
return Math.round((target-today)/86400000);
}
function destinationName(value){const v=(value||'').trim();if(/^[a-z]{2}$/i.test(v)){try{return new Intl.DisplayNames(['en-GB'],{type:'region'}).of(v.toUpperCase())||v}catch(e){return v}}return v}
function shortDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return '';const [y,m,d]=date.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):''}
function policyStatus(date){
const days=policyDays(date);
if(days===null)return 'No expiry date';
if(days<0)return 'Expired';
if(days===0)return 'Expires today · '+shortDate(date);
return days+' '+(days===1?'day':'days')+' remaining · Expires '+shortDate(date);
}

document.getElementById('insuranceFiles').onchange=e=>{pendingInsuranceFiles.push(...e.target.files);refreshPendingFiles();e.target.value=''};
document.getElementById('cameraFile').onchange=e=>{pendingInsuranceFiles.push(...e.target.files);refreshPendingFiles();e.target.value=''};
}document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());const photos=[...(rec?.photos||[])];if(page==='Inventory'){const fs=[...document.getElementById('photos').files];if(fs.length+photos.length>8){alert('Maximum 8 photos per item');return}for(const f of fs){if(!f.type.startsWith('image/'))continue;try{photos.push(await shrink(f))}catch(err){alert('Could not read photo: '+err.message);return}}}let attachments=[...(rec?.attachments||[])];if(page==='Insurance'){attachments=[...(rec?.attachments||[])].flatMap((a,i)=>{const el=document.querySelector('[data-existing="'+i+'"]');return el?[{...a,nickname:el.querySelector('[data-nickname]').value.trim()||a.name,type:el.querySelector('[data-doc-type]').value,customType:el.querySelector('[data-doc-type]').value==='Other'?el.querySelector('[data-custom-type]').value.trim():''}]:[]});const fs=pendingInsuranceFiles;for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>5*1024*1024){alert('File too large (5 MB maximum): '+f.name);return}try{attachments.push({id:crypto.randomUUID(),name:f.name,type:document.querySelector('[data-new-type="'+i+'"]')?.value||'Other',customType:document.querySelector('[data-new-type="'+i+'"]')?.value==='Other'?(document.querySelector('[data-new-custom-type="'+i+'"]')?.value.trim()||''):'',nickname:document.querySelector('[data-new-nickname="'+i+'"]')?.value.trim()||f.name,uploadedAt:new Date().toISOString(),data:await fileData(f)})}catch(err){alert('Could not read document: '+err.message);return}}}if(page==='Insurance'&&data.category!=='Vehicle')data.registration='';if(page==='Insurance'&&data.category!=='Pet')data.petName='';if(page==='Insurance'&&data.coverType!=='Individual')data.coveredName='';const saved={...rec,...data,id:rec?.id||crypto.randomUUID(),section:page,photos,attachments,updated:new Date().toISOString()};try{await put(saved);render()}catch(err){alert('Could not save. Browser storage may be full. '+err.message)}}}
function formatDate(value){if(!value)return 'Unknown date';const d=new Date(value);return isNaN(d.getTime())?'Unknown date':d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function fileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||Error('File read failed'));reader.readAsDataURL(file)})}
function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))}catch(e){reject(e)}finally{URL.revokeObjectURL(u)}};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Unsupported image'))};img.src=u})}
document.getElementById('settings').onclick=()=>navigate('Settings');render().catch(e=>{document.getElementById('content').textContent='Unable to open local storage: '+e.message});
</script></body></html>
